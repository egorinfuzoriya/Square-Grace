<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"><title>Square grace</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Jost:wght@700;900&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; overflow: hidden; background: #050508; font-family: 'Jost', sans-serif; user-select: none; }
        
        canvas { 
            display: block; 
            position: absolute; 
            z-index: 1;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1)) saturate(1.8) contrast(1.2);
        }
        
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: #ffffff; font-size: 32px; font-weight: 900; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); pointer-events: none; }
        #scoreVal { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .screen { position: absolute; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; background: rgba(5,5,8,0.95); text-align: center; }
        #logo { max-width: 400px; max-height: 150px; margin-bottom: 25px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.6)); }
        #title { margin: 0 0 10px 0; font-size: 46px; font-weight: 900; color: #ff0055; text-transform: uppercase; letter-spacing: 1px; }
        
        #subtitle { 
            margin: 0 0 30px 0; 
            font-size: 24px; 
            font-weight: 700; 
            color: #fff; 
            line-height: 1.6; 
            font-family: 'Jost', 'Segoe UI', Verdana, sans-serif;
        }
        
        .btn-container { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn { padding: 14px 50px; font-size: 24px; font-weight: 900; color: #fff; background: #ff0055; border: none; border-radius: 20px; cursor: pointer; transition: 0.2s ease; text-transform: uppercase; }
        .btn:hover { background: #ff2277; transform: scale(1.03); }
        .reset-btn { padding: 8px 20px; font-size: 14px; background: #333; color: #aaa; border-radius: 12px; box-shadow: none; border: none; cursor: pointer; transition: 0.2s ease; font-weight: 700; }
        .reset-btn:hover { background: #444; color: #fff; }
    </style>
</head>
<body>
    <audio id="bgMusic" src="music.wav" loop></audio>
    <div id="ui" class="ui">Очки: <span id="scoreVal">0</span></div>
    <div id="screen" class="screen">
        <img id="logo" src="gamelogo.png" alt="Космическая Ходилка">
        <h1 id="title"></h1><div id="subtitle"></div>
        <div class="btn-container">
            <button id="btn" class="btn">ИГРАТЬ</button>
            <button id="reset-stats" class="reset-btn">СБРОСИТЬ РЕКОРД</button>
        </div>
    </div>
    <canvas id="cvs"></canvas>
<script>
    const c = document.getElementById("cvs"), ctx = c.getContext("2d"), scoreVal = document.getElementById("scoreVal");
    const scr = document.getElementById("screen"), logo = document.getElementById("logo"), title = document.getElementById("title"), subtitle = document.getElementById("subtitle"), btn = document.getElementById("btn"), resetBtn = document.getElementById("reset-stats");
    const bgMusic = document.getElementById("bgMusic");
    
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
        initAudio(); if (!audioCtx) return;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.15);
        } else if (type === 'coin') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(987.77, now); osc.frequency.setValueAtTime(1318.51, now + 0.08);
            gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.3);
        } else if (type === 'over') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(55, now + 0.5);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(now + 0.5);
        }
    }
                let x, y, size = 25, kbdSpeed = 7, score = 0, isPlaying = false, isGameOver = false, coin = {size: 15}, enemies = [], particles = [];
    let lastScore = localStorage.getItem("lastScore") || 0, highScore = localStorage.getItem("highScore") || 0, gameStartedOnce = false;
    let prevX = 0, prevY = 0;

    window.onresize = () => { c.width = window.innerWidth; c.height = window.innerHeight; }; window.onresize();

    function updateMenuText() {
        if (isGameOver) {
            logo.style.display = "none"; title.innerText = "ВЫ ПРОИГРАЛИ!";
            subtitle.innerHTML = `Было собрано ${score} очков<br><span style="color: #00ffcc;">Лучший рекорд: ${highScore}</span>`;
            btn.innerText = "ЗАНОВО"; resetBtn.style.display = "block";
        } else if (!gameStartedOnce) {
            logo.style.display = "block"; title.innerText = "*Грация квадрата";
            subtitle.innerHTML = `Прошлый результат: ${lastScore}<br><span style="color: #00ffcc;">Лучший рекорд: ${highScore}</span>`;
            btn.innerText = "ИГРАТЬ"; resetBtn.style.display = "block";
        } else {
            logo.style.display = "block"; title.innerText = "ПАУЗА"; subtitle.innerText = "";
            btn.innerText = "ПРОДОЛЖИТЬ"; resetBtn.style.display = "none";
        }
    }
    updateMenuText();

    btn.onclick = () => { playSound('click'); if (isGameOver) { isGameOver = false; reset(); } c.requestPointerLock(); };
    resetBtn.onclick = () => { playSound('click'); localStorage.setItem("lastScore",0); localStorage.setItem("highScore",0); lastScore = 0; highScore = 0; updateMenuText(); };

    document.onpointerlockchange = () => {
        isPlaying = document.pointerLockElement === c;
        if (isPlaying) { gameStartedOnce = true; scr.style.display = "none"; bgMusic.play().catch(()=>{}); prevX = x; prevY = y; } 
        else { scr.style.display = "flex"; updateMenuText(); bgMusic.pause(); }
    };

    document.onmousemove = e => { if (isPlaying) { x += e.movementX * 1.3; y += e.movementY * 1.3; } };
    let keys = {}; window.onkeydown = e => keys[e.code] = true; window.onkeyup = e => keys[e.code] = false;

    function reset() {
        score = 0; scoreVal.innerText = 0; x = c.width/2; y = c.height/2; enemies = []; particles = [];
        coin.x = Math.random()*(c.width-40)+20; coin.y = Math.random()*(c.height-40)+20;
        for(let i=0; i<5; i++) spawn();
    }
    function spawn() { enemies.push({x: Math.random()*c.width, y: Math.random()*c.height, size: 20, dx: (Math.random()-0.5)*7, dy: (Math.random()-0.5)*7}); }
    function col(r1, r2) { return r1.x < r2.x + r2.size && r1.x + r1.size > r2.x && r1.y < r2.y + r2.size && r1.y + r1.size > r2.y; }

    function createExplosion(tx, ty) {
        for (let i = 0; i < 20; i++) {
            let angle = Math.random() * Math.PI * 2, speed = Math.random() * 4 + 2;
            particles.push({ x: tx + coin.size/2, y: ty + coin.size/2, dx: Math.cos(angle)*speed, dy: Math.sin(angle)*speed, size: Math.random()*4+2, alpha: 1, decay: Math.random()*0.03+0.015, color: "0, 255, 204" });
        }
    }

    reset();
    function loop() {
        if (isPlaying && !isGameOver) {
            if (keys["ArrowLeft"]) x -= kbdSpeed; if (keys["ArrowRight"]) x += kbdSpeed;
            if (keys["ArrowUp"]) y -= kbdSpeed; if (keys["ArrowDown"]) y += kbdSpeed;
            x = Math.max(0, Math.min(c.width - size, x)); y = Math.max(0, Math.min(c.height - size, y));

            let movedX = x - prevX, movedY = y - prevY;
            if (movedX !== 0 || movedY !== 0) {
                for(let i = 0; i < 2; i++) {
                    particles.push({
                        x: x + size/2 + (Math.random() - 0.5) * 8, y: y + size/2 + (Math.random() - 0.5) * 8,
                        dx: -movedX * 0.15 + (Math.random() - 0.5) * 0.5, dy: -movedY * 0.15 + (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 5 + 2, alpha: 0.9, decay: Math.random() * 0.03 + 0.02, color: "255, 0, 85"
                    });
                }
            }
            prevX = x; prevY = y;

            let p = {x, y, size};
            if (col(p, coin)) { 
                score++; scoreVal.innerText = score; playSound('coin'); createExplosion(coin.x, coin.y);
                coin.x = Math.random()*(c.width-40)+20; coin.y = Math.random()*(c.height-40)+20; if(score%3===0) spawn(); 
            }
            
            enemies.forEach(e => {
                e.x += e.dx; e.y += e.dy;
                if (e.x<=0 || e.x>=c.width-e.size) e.dx *= -1; if (e.y<=0 || e.y>=c.height-e.size) e.dy *= -1;
                if (Math.random() < 0.4) {
                    particles.push({ x: e.x + e.size/2, y: e.y + e.size/2, dx: -e.dx * 0.2, dy: -e.dy * 0.2, size: Math.random() * 4 + 2, alpha: 0.8, decay: 0.03, color: "153, 0, 255" });
                }
                if (col(p, e)) {
                    isGameOver = true; isPlaying = false; document.exitPointerLock(); playSound('over');
                    lastScore = score; localStorage.setItem("lastScore", lastScore);
                    if (score > highScore) { highScore = score; localStorage.setItem("highScore", highScore); }
                }
            });
            particles.forEach((pt, index) => { pt.x += pt.dx; pt.y += pt.dy; pt.alpha -= pt.decay; if (pt.alpha <= 0) particles.splice(index, 1); });
        }
        
        ctx.fillStyle = "#050508"; ctx.fillRect(0, 0, c.width, c.height); 
        ctx.globalCompositeOperation = 'screen';
        
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#ff0055"; ctx.shadowColor = "#ff0055"; ctx.fillRect(x, y, size, size); 
        ctx.fillStyle = "#00ffcc"; ctx.shadowColor = "#00ffcc"; ctx.fillRect(coin.x, coin.y, coin.size, coin.size); 
        ctx.fillStyle = "#9900ff"; ctx.shadowColor = "#9900ff"; enemies.forEach(e => ctx.fillRect(e.x, e.y, e.size, e.size)); 
        particles.forEach(pt => { ctx.fillStyle = `rgba(${pt.color}, ${pt.alpha})`; ctx.shadowColor = `rgb(${pt.color})`; ctx.fillRect(pt.x, pt.y, pt.size, pt.size); });

        ctx.shadowBlur = 0; 
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
